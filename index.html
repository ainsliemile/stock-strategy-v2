<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>波段與動能數據透視面板 (AI 輔助版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 🔑 記得在這裡填入您的 Gemini API 金鑰！
        const apiKey = "請在此填入您的Gemini_API_Key"; 

        const App = () => {
          const [inputs, setInputs] = useState(Array(110).fill(""));
          const [default100, setDefault100] = useState([]);
          const [results, setResults] = useState([]);
          const [isLoading, setIsLoading] = useState(false);
          const [lastUpdateTime, setLastUpdateTime] = useState(null);
          const [fetchStatus, setFetchStatus] = useState("正在與 Papa Bear 系統連線...");

          const [aiContent, setAiContent] = useState("");
          const [isAiLoading, setIsAiLoading] = useState(false);
          const [showAiModal, setShowAiModal] = useState(false);

          useEffect(() => {
            fetchTopMomentum();
          }, []);

          const fetchTopMomentum = async () => {
              try {
                const timestamp = new Date().getTime();
                const response = await fetch(`https://ainsliemile.github.io/papa-bear-dashboard/momentum_history.json?t=${timestamp}`);
                const data = await response.json();
                
                let all = [];
                if (data.current_all) {
                  for (const cat in data.current_all) {
                    all = all.concat(data.current_all[cat]);
                  }
                }

                // 🌟 使用 Map 進行嚴格去重，確保同一檔股票只出現一次
                const uniqueMap = new Map();
                all.forEach(item => {
                  if (!uniqueMap.has(item.symbol)) {
                    uniqueMap.set(item.symbol, item);
                  }
                });
                const uniqueAll = Array.from(uniqueMap.values());

                // 重新依據動能分數排序，並截取前 100 名
                uniqueAll.sort((a, b) => b.momentum - a.momentum);
                const top100 = uniqueAll.slice(0, 100).map(item => item.symbol);
                
                setDefault100(top100);
                loadDefault(top100);
                setFetchStatus(`✅ 成功載入本週強勢股 (最新更新: ${data.update_time})`);
              } catch (error) {
                setFetchStatus("⚠️ 無法載入預設名單。");
              }
          };

          const loadDefault = (list = default100) => {
            const newInputs = [...list, ...Array(110 - list.length).fill("")];
            setInputs(newInputs);
          };

          const handleClearAll = () => {
            setInputs(Array(110).fill(""));
          };

          const handleInputChange = (index, value) => {
            const newInputs = [...inputs];
            newInputs[index] = value.toUpperCase().trim();
            setInputs(newInputs);
          };

          const handleExecute = async () => {
            setIsLoading(true);
            setResults([]);
            const activeSymbols = inputs.filter(symbol => symbol !== "");

            if (activeSymbols.length === 0) {
              alert("請至少輸入一檔標的代碼！");
              setIsLoading(false);
              return;
            }

            try {
              const response = await fetch('https://my-stock-api-v2.onrender.com/api/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ symbols: activeSymbols }),
              });
              if (!response.ok) throw new Error("伺服器連線異常");
              const data = await response.json();
              
              // 賦予唯一 ID 以利 React 渲染
              setResults(data.map((item, index) => ({ ...item, id: index })));
              setLastUpdateTime(new Date().toLocaleTimeString());
            } catch (error) {
              setAiContent("❌ 連線失敗，請確認您的 Render 雲端伺服器是否處於正常運作狀態！");
              setShowAiModal(true);
            } finally {
              setIsLoading(false);
            }
          };

          const callGeminiAPI = async (promptText) => {
            if (!apiKey || apiKey === "請在此填入您的Gemini_API_Key") {
              return "⚠️ 系統提示：請先在 index.html 程式碼最上方（約第 19 行）設定您的 Gemini API 金鑰！";
            }
            
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            const payload = {
              contents: [{ parts: [{ text: promptText }] }],
              systemInstruction: { 
                parts: [{ text: "你是一位資深的量化交易員與市場分析師。請用繁體中文回答，語氣專業、客觀且條理分明。絕對不要給出明確的投資買賣建議，僅針對提供的技術指標與動能數據進行客觀解讀。" }] 
              }
            };
            
            try {
              const res = await fetch(url, { 
                method: "POST", 
                headers: { "Content-Type": "application/json" }, 
                body: JSON.stringify(payload) 
              });
              const data = await res.json();
              if (!res.ok) {
                return `❌ AI 伺服器連線被拒絕！\n\n錯誤代碼：${data.error?.code || '未知'}\n錯誤訊息：${data.error?.message || '未知的 API 錯誤'}\n\n👉 請檢查 API Key。`;
              }
              return data.candidates?.[0]?.content?.parts?.[0]?.text || "AI 暫時無法產生回應，請稍後再試。";
            } catch (err) { 
              return "❌ 網路連線錯誤，無法呼叫 Google AI 伺服器。"; 
            }
          };

          const generateGlobalReport = async () => {
            if (results.length === 0) return;
            setIsAiLoading(true);
            setShowAiModal(true);
            setAiContent("✨ Gemini AI 正在深度分析當前盤勢，請稍候...");
            const top10 = results.slice(0, 10).map(r => `- ${r.symbol}: 動能 ${r.momentum_score_str}, 買進 [${r.buy_signal}], 賣出 [${r.sell_signal}]`).join('\n');
            const prompt = `這是根據我的動力量化策略選出的前 10 名強勢標的：\n${top10}\n請以此為依據，給我一段大約 200 字的簡短綜合盤勢觀察。`;
            const text = await callGeminiAPI(prompt);
            setAiContent(text);
            setIsAiLoading(false);
          };

          const generateStockReport = async (stock) => {
            setIsAiLoading(true);
            setShowAiModal(true);
            setAiContent(`✨ Gemini AI 正在專屬診斷 ${stock.symbol}，請稍候...`);
            const prompt = `請為標的「${stock.symbol}」提供技術診斷。數據：動能 ${stock.momentum_score_str}, 股價 ${stock.current_price}, 月K ${stock.monthly_k}, 乖離率 ${stock.bias_val}%, 週背離 ${stock.weekly_divergence ? '有' : '無'}, 買進階段 ${stock.buy_signal}, 賣出階段 ${stock.sell_signal}。`;
            const text = await callGeminiAPI(prompt);
            setAiContent(text);
            setIsAiLoading(false);
          };

          return (
            <>
              <div className="min-h-screen bg-slate-900 text-slate-100 p-3 md:p-6 font-sans">
                <div className="max-w-7xl mx-auto">
                  <header className="mb-6 border-b border-slate-700 pb-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <h1 className="text-2xl md:text-3xl font-bold text-white flex items-center gap-3">
                      <span className="text-yellow-400">🐻</span> 全自動百大動能 + 數據透視面板
                    </h1>
                  </header>

                  <div className="bg-slate-800 rounded-xl p-4 shadow-xl mb-6 border border-slate-700 text-sm text-slate-300">
                    <p><span className="text-yellow-400 font-bold">💡 動能公式說明：</span> 動能排名是依據標的之 <strong>(1個月 + 3個月 + 6個月) 總報酬率的平均值</strong> 進行計算與排序。數值 &gt; 0 才會進行排名，&lt; 0 則判定為「不投資」。</p>
                  </div>

                  <section className="bg-slate-800 rounded-xl p-4 md:p-6 shadow-xl mb-8 border border-slate-700">
                    <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-4 gap-4">
                      <div>
                        <h2 className="text-lg font-semibold text-blue-300">股票輸入區 (110格)</h2>
                        <p className="text-sm text-slate-400 mt-1">{fetchStatus}</p>
                      </div>
                      <div className="flex flex-wrap gap-2 w-full lg:w-auto">
                        <button onClick={handleClearAll} className="flex-1 lg:flex-none px-4 py-2 bg-red-900/40 hover:bg-red-800/60 text-red-300 border border-red-700/50 rounded-lg text-sm font-bold transition-colors">🗑️ 清空全部</button>
                        <button onClick={() => loadDefault()} className="flex-1 lg:flex-none px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-bold transition-colors">🔄 載入預設 100 檔</button>
                        <button onClick={handleExecute} disabled={isLoading} className="w-full lg:w-auto px-6 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-bold shadow-[0_0_15px_rgba(37,99,235,0.4)] transition-all">
                          {isLoading ? "運算中..." : "開始分析"}
                        </button>
                      </div>
                    </div>
                    <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-2 h-64 overflow-y-auto pr-2 custom-scrollbar">
                      {inputs.map((val, idx) => (
                        <input key={idx} type="text" value={val} onChange={(e) => handleInputChange(idx, e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white uppercase focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500" placeholder={`${idx + 1}.`}/>
                      ))}
                    </div>
                  </section>

                  {}
                  {results.length > 0 && (
                    <section className="bg-slate-800 rounded-xl p-4 shadow-xl border border-slate-700 overflow-hidden">
                      <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-3">
                        <div>
                          <h2 className="text-lg font-semibold text-blue-300">掃描結果 (已依動能排序)</h2>
                          <span className="text-xs text-slate-400">更新時間: {lastUpdateTime}</span>
                        </div>
                        <button onClick={generateGlobalReport} disabled={isAiLoading} className="px-4 py-2 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 transition-all text-white font-semibold rounded-lg shadow-xl">✨ AI 盤勢總結</button>
                      </div>
                      <div className="overflow-x-auto h-[600px] overflow-y-auto custom-scrollbar">
                        <table className="min-w-full text-left border-collapse">
                          <thead className="sticky top-0 bg-slate-900 z-20 shadow-md">
                            <tr className="border-y border-slate-600 text-xs">
                              <th className="p-3 sticky left-0 bg-slate-900 z-30 font-semibold text-slate-200">標的代碼</th>
                              <th className="p-3 font-semibold text-white whitespace-nowrap">當前股價</th>
                              <th className="p-3 font-semibold text-yellow-300 whitespace-nowrap">動能排名</th>
                              <th className="p-3 font-semibold text-blue-300 whitespace-nowrap">買進建倉</th>
                              <th className="p-3 font-semibold text-green-300 whitespace-nowrap">賣出撤退階段</th>
                              <th className="p-3 font-semibold text-orange-200 text-xs">買進指標數據 (月K/KD/乖離/週背離)</th>
                              <th className="p-3 font-semibold text-teal-200 text-xs">賣出指標數據 (週MACD/柱狀/20週線)</th>
                              <th className="p-3 font-semibold text-purple-300 text-center sticky right-0 bg-slate-900 z-20 whitespace-nowrap">AI 助理</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-700/70">
                            {results.map((res) => (
                              <tr key={res.id} className="hover:bg-slate-750 text-sm transition-colors">
                                <td className="p-3 font-bold sticky left-0 bg-slate-800 z-10 text-white">{res.symbol}</td>
                                <td className="p-3 font-mono text-white font-semibold">{res.current_price}</td>
                                <td className="p-3 whitespace-nowrap">
                                  <span className="px-2 py-0.5 rounded-full bg-slate-700 border border-slate-600 text-xs shadow-sm">{res.momentum_rank}</span>
                                  <span className={`ml-2 text-xs font-mono ${res.momentum_score < 0 ? 'text-red-400' : 'text-green-400'}`}>{res.momentum_score_str}</span>
                                </td>
                                <td className="p-3 whitespace-nowrap">
                                  <span className={`px-2 py-1 rounded font-bold text-xs ${
                                    res.buy_signal === '右側重壓(50%)' ? 'bg-red-500/20 text-red-400 border border-red-500/50' : 
                                    res.buy_signal === '底部加碼(30%)' ? 'bg-pink-500/20 text-pink-400 border border-pink-500/50' : 
                                    res.buy_signal === '左側建倉(20%)' ? 'bg-orange-500/20 text-orange-400 border border-orange-500/50' : 
                                    'text-slate-400'
                                  }`}>{res.buy_signal}</span>
                                </td>
                                <td className="p-3 whitespace-nowrap">
                                  <span className={`px-2 py-1 rounded font-bold text-xs ${
                                    res.sell_signal === '清倉(100%)' ? 'bg-green-600/30 text-green-300 border border-green-500 shadow-[0_0_8px_rgba(34,197,94,0.4)]' : 
                                    res.sell_signal === '緊急減碼(50%)' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/50' : 
                                    res.sell_signal === '頂部減碼(30%)' ? 'bg-teal-500/20 text-teal-400 border border-teal-500/50' : 
                                    res.sell_signal === '預警減碼(20%)' ? 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/50' : 
                                    'text-slate-400'
                                  }`}>{res.sell_signal}</span>
                                </td>
                                <td className="p-3 text-xs text-slate-300 whitespace-nowrap">
                                  <div>月K: <span className={res.monthly_k < 30 ? "text-red-400 font-bold" : ""}>{res.monthly_k}</span> | KD: <span className={res.monthly_kd_cross === 'GOLDEN' ? "text-red-400 font-bold" : res.monthly_kd_cross === 'DEATH' ? "text-green-400 font-bold" : ""}>{res.monthly_kd_cross === 'GOLDEN' ? '金叉' : res.monthly_kd_cross === 'DEATH' ? '死叉' : '-'}</span></div>
                                  <div className="mt-1">乖離: <span className={res.bias_val < -15 ? "text-red-400 font-bold" : ""}>{res.bias_val}%</span> | 週背離: <span className={res.weekly_divergence ? "text-pink-400 font-bold" : ""}>{res.weekly_divergence ? 'YES' : '-'}</span></div>
                                </td>
                                <td className="p-3 text-xs text-slate-300 whitespace-nowrap">
                                  <div>MACD: <span className={res.weekly_macd_cross === 'GOLDEN' ? "text-red-400 font-bold" : res.weekly_macd_cross === 'DEATH' ? "text-green-400 font-bold" : ""}>{res.weekly_macd_cross === 'GOLDEN' ? '金叉' : res.weekly_macd_cross === 'DEATH' ? '死叉' : '-'}</span></div>
                                  <div className="mt-1">柱狀: <span className={res.weekly_hist_shrinking ? "text-cyan-400 font-bold" : ""}>{res.weekly_macd_hist} {res.weekly_hist_shrinking ? '(縮)' : ''}</span> | 20週: {res.weekly_ma20}</div>
                                </td>
                                <td className="p-3 text-center sticky right-0 bg-slate-800 z-10 shadow-[-4px_0_6px_-2px_rgba(0,0,0,0.3)]">
                                  <button onClick={() => generateStockReport(res)} className="p-2 bg-slate-700 hover:bg-purple-600 rounded-full transition-colors group" title="AI 診斷">
                                    <span className="grayscale group-hover:grayscale-0 transition-all">✨</span>
                                  </button>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </section>
                  )}

                  {}
                  <footer className="mt-8 mb-4 bg-slate-800 rounded-xl p-6 border border-slate-700 text-sm text-slate-400 leading-relaxed shadow-xl">
                    <h4 className="text-blue-300 font-bold mb-3 text-base flex items-center gap-2">
                      <span className="text-lg">⚠️</span> 雲端平台免費方案保活指南 (必讀)
                    </h4>
                    <ul className="list-disc pl-5 space-y-2">
                      <li><strong>Render (後端伺服器)：</strong> 超過 15 分鐘無人使用會自動休眠。<span className="text-slate-200">無須定期登入後台</span>，只需在打開網頁時耐心等待 1~2 分鐘讓伺服器喚醒即可。</li>
                      <li><strong>GitHub Actions (百大名單自動更新)：</strong> 官方規定若專案庫 <span className="text-red-300 font-bold">連續 60 天無任何活動</span>，會自動暫停排程。<span className="text-slate-200">強烈建議您每 1.5 個月 (約 45 天) 登入 GitHub 一次</span>，隨意修改一下 README.md 檔案的文字並儲存，以保持帳號活躍。</li>
                      <li><strong>Gemini API (AI 助理)：</strong> 金鑰永久有效，只要不超出免費呼叫額度，<span className="text-slate-200">無須定期登入</span>即可持續運作。</li>
                    </ul>
                  </footer>

                </div>

                {showAiModal && (
                  <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm transition-opacity">
                    <div className="bg-slate-800 border border-purple-500/50 shadow-[0_0_30px_rgba(147,51,234,0.2)] rounded-2xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[80vh]">
                      <div className="bg-slate-900/80 p-4 border-b border-slate-700 flex justify-between items-center">
                        <h3 className="text-lg font-bold text-white flex items-center gap-2">
                          <span className="text-xl animate-pulse">✨</span> 
                          Gemini 量化投資助理
                        </h3>
                        <button onClick={() => setShowAiModal(false)} className="text-slate-400 hover:text-white transition-colors">
                          <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                          </svg>
                        </button>
                      </div>
                      <div className="p-6 overflow-y-auto custom-scrollbar text-slate-200 leading-relaxed text-sm md:text-base whitespace-pre-wrap">
                        {aiContent}
                      </div>
                      <div className="bg-slate-900 p-3 text-center text-xs text-slate-500 border-t border-slate-700">
                        AI 產生之內容僅供參考，不構成任何投資建議。
                      </div>
                    </div>
                  </div>
                )}
              </div>
              <style>
                {`
                  .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
                  .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; border-radius: 4px; }
                  .custom-scrollbar::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }
                  .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #60a5fa; }
                `}
              </style>
            </>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
